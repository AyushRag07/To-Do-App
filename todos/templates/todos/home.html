
{% extends 'todos/base.html' %}

{% block title %}Welcome - TODO App{% endblock %}

{% block content %}

<style>
    .hero-bg {
        background-image:
            linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.55)),
            url("https://images.unsplash.com/photo-1589287707312-213624549c88?q=80&w=1074&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D");

        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        min-height: 85vh;
        display: flex;
        align-items: center;
        border-radius: 12px;
    }
</style>

<div class="hero-bg text-white px-4 my-4">
    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-md-8 text-center">

                <h1 class="display-4 mb-4 fw-bold">
                    Welcome to TODO App
                </h1>

                <p class="lead mb-5">
                    Manage Your Tasks
                </p>

                {% if user.is_authenticated %}

                    <div class="alert alert-info">
                        You're already logged in as
                        <strong>{{ user.username }}</strong>
                    </div>

                    <a href="{% url 'todo_list' %}"
                       class="btn btn-primary btn-lg px-4">
                        Go to My TODOs
                    </a>

                {% else %}

                    <div class="d-grid gap-3 d-sm-flex justify-content-sm-center">

                        <a href="{% url 'login' %}"
                           class="btn btn-primary btn-lg px-4">
                            Login
                        </a>

                        <a href="{% url 'register' %}"
                           class="btn btn-outline-light btn-lg px-4">
                            Register
                        </a>

                    </div>

                {% endif %}

            </div>
        </div>
    </div>
</div>

{% endblock %}
